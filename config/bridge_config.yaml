# Actuator 1: Pitch Stabilator (Elevator)
- ros_topic_name: "/control/elevator_cmd"
  gz_topic_name: "/model/uav_landing_rig/joint/horizontal_stabilizer_joint/0/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

# Actuator 2: Retractable Landing Gear
- ros_topic_name: "/control/gear_cmd"
  gz_topic_name: "/model/uav_landing_rig/joint/landing_gear_joint/0/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

# Sensor 1: 9-DoF IMU
- ros_topic_name: "/sensing/imu/data_raw"
  gz_topic_name: "/model/uav_landing_rig/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# Sensor 2: Downward Sonar
- ros_topic_name: "/sensing/sonar/scan"
  gz_topic_name: "/model/uav_landing_rig/sonar_down"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# Sensor 3: Fore ToF 1
- ros_topic_name: "/sensing/tof/fore"
  gz_topic_name: "/model/uav_landing_rig/tof_1"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# Sensor 4: Port ToF 2
- ros_topic_name: "/sensing/tof/port"
  gz_topic_name: "/model/uav_landing_rig/tof_2"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# Sensor 5: Starboard ToF 3
- ros_topic_name: "/sensing/tof/starboard"
  gz_topic_name: "/model/uav_landing_rig/tof_3"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# Simulation Clock
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS